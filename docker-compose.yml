version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: peersolve
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/peersolve?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "replace-in-prod"
      CLERK_SECRET_KEY: "replace-in-prod"
      CORS_ORIGIN: "http://localhost:5173"
      PORT: "3000"
      HOST: "0.0.0.0"
    depends_on:
      - db
      - redis
    ports:
      - "3000:3000"

volumes:
  db-data:
